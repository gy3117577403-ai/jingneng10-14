<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京能协同 · 浙江京能电力设备有限公司</title>
<style>
/* ============ 主题变量 ============ */
:root, [data-theme="light"] {
  --bg: #f5f5f7;
  --card: #ffffff;
  --card-2: #fafafc;
  --text: #1c1e26;
  --text-2: #636672;
  --text-3: #9aa0ae;
  --border: #e7eaf1;
  --border-soft: #eff1f6;
  --accent: #0a84ff;
  --accent-hover: #0071e3;
  --accent-soft: rgba(10,132,255,.10);
  --green: #28c76f;
  --green-soft: rgba(40,199,111,.12);
  --red: #ff5a5f;
  --red-soft: rgba(255,90,95,.10);
  --orange: #ff9f0a;
  --orange-soft: rgba(255,159,10,.13);
  --purple: #a259ff;
  --purple-soft: rgba(162,89,255,.12);
  --blue-soft: rgba(10,132,255,.10);
  --sidebar-bg: #ffffff;
  --topbar-bg: rgba(245,245,247,.8);
  --input-bg: #f1f3f8;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px -14px rgba(16,24,40,.14);
  --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
  --shadow-lg: 0 24px 60px -12px rgba(16,24,40,.22);
  --drawer-bg: #ffffff;
  --drawer-frost: rgba(255,255,255,.88);
  --hover-bg: #f3f5f9;
}
[data-theme="dark"] {
  --bg: #0e1014;
  --card: #171a21;
  --card-2: #1c2029;
  --text: #e9ebf1;
  --text-2: #a7adba;
  --text-3: #6b7280;
  --border: #262b36;
  --border-soft: #20242e;
  --accent: #0a84ff;
  --accent-hover: #409cff;
  --accent-soft: rgba(10,132,255,.16);
  --green: #30d158;
  --green-soft: rgba(48,209,88,.14);
  --red: #ff6961;
  --red-soft: rgba(255,105,97,.14);
  --orange: #ffb340;
  --orange-soft: rgba(255,179,64,.15);
  --purple: #c07bff;
  --purple-soft: rgba(192,123,255,.15);
  --blue-soft: rgba(10,132,255,.16);
  --sidebar-bg: #14171e;
  --topbar-bg: rgba(14,16,20,.80);
  --input-bg: #20242e;
  --shadow: 0 1px 2px rgba(0,0,0,.30), 0 12px 30px -14px rgba(0,0,0,.55);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow-lg: 0 24px 60px -12px rgba(0,0,0,.6);
  --drawer-bg: #171a21;
  --drawer-frost: rgba(23,26,33,.88);
  --hover-bg: #20242e;
}

/* ============ 侧边栏宽度变量（拖拽 / 折叠时由 JS 改写） ============ */
:root { --sidebar-w: 236px; }
body.side-collapsed { --sidebar-w: 72px; }
body.resizing { user-select: none; cursor: ew-resize; }
body.resizing .sidebar, body.resizing .main { transition: none !important; }

/* ============ 基础 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  transition: background .3s, color .3s;
  overflow-x: hidden;
}
::placeholder { color: var(--text-3); }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* ============ 布局 ============ */
#app { display: flex; min-height: 100vh; }

/* ---- 侧边栏 ---- */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  position: fixed; top: 0; left: 0; bottom: 0;
  display: flex; flex-direction: column;
  z-index: 50;
  transition: width .25s ease, background .3s, border-color .3s;
}
.logo { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; }
.logo-mark {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 60%, #a259ff 100%);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 20px; font-weight: 700;
  box-shadow: 0 6px 16px -6px rgba(10,132,255,.55);
}
.logo-name { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.logo-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.nav { flex: 1; padding: 6px 12px; overflow-y: auto; }
.nav-group { font-size: 11px; color: var(--text-3); padding: 14px 12px 6px; letter-spacing: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px; margin-bottom: 2px;
  color: var(--text-2); cursor: pointer; font-size: 14px; font-weight: 500;
  transition: all .22s ease; border: none; background: transparent; width: 100%; text-align: left;
}
.nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.nav-item:hover { background: var(--hover-bg); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
}
.sidebar-foot {
  padding: 16px; border-top: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-foot .meta { font-size: 12px; color: var(--text-3); }
.sidebar-foot .meta b { display: block; font-size: 13px; color: var(--text); }

/* ---- 主区域 ---- */
.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; transition: margin-left .25s ease; }
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: 66px; display: flex; align-items: center; gap: 16px;
  padding: 0 28px;
  background: var(--topbar-bg);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  transition: background .3s, border-color .3s;
}
.topbar-title { font-size: 16px; font-weight: 700; white-space: nowrap; }
.search-wrap { position: relative; flex: 1; max-width: 420px; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--input-bg); border-radius: 12px; padding: 8px 14px;
  border: 1px solid transparent; transition: all .2s;
}
.search-box:focus-within { background: var(--card); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-box input { border: none; outline: none; background: transparent; flex: 1; font-size: 13.5px; color: var(--text); }
.search-box .s-icon { color: var(--text-3); font-size: 15px; }
.search-results {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lg); overflow: hidden; display: none; max-height: 340px; overflow-y: auto;
}
.search-results.show { display: block; animation: popIn .18s ease; }
.search-result-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; font-size: 13px;
}
.search-result-item:hover { background: var(--hover-bg); }
.search-result-item .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: none; background: transparent;
  color: var(--text-2); font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: all .22s ease; position: relative;
}
.icon-btn:hover { background: var(--hover-bg); color: var(--text); transform: translateY(-1px); }
.badge-dot {
  position: absolute; top: 8px; right: 9px; min-width: 17px; height: 17px; padding: 0 5px;
  background: var(--red); color: #fff; font-size: 10px; font-weight: 700;
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--topbar-bg);
}
.user-chip {
  display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 5px;
  border-radius: 14px; border: none; background: transparent; transition: all .22s ease;
}
.user-chip:hover { background: var(--hover-bg); }
.user-chip .u-name { font-size: 13px; font-weight: 600; }
.user-chip .u-role { font-size: 11px; color: var(--text-3); }
.dropdown {
  position: absolute; top: calc(100% + 10px); right: 0;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lg); min-width: 300px; display: none; overflow: hidden; z-index: 60;
}
.dropdown.show { display: block; animation: popIn .18s ease; }
.dropdown-head { padding: 12px 16px; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; }
.dropdown-head a { font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 500; }
.notif-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .15s; }
.notif-item:last-child { border-bottom: none; }
.notif-item:hover { background: var(--hover-bg); }
.notif-item.unread { background: var(--accent-soft); }
.notif-item .n-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.notif-item .n-title { font-size: 13px; font-weight: 600; }
.notif-item .n-desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.notif-item .n-time { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.menu-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; font-size: 13.5px; cursor: pointer; transition: background .15s; border: none; background: none; width: 100%; text-align: left; color: var(--text); }
.menu-item:hover { background: var(--hover-bg); }
.menu-item.danger { color: var(--red); }
.menu-divider { height: 1px; background: var(--border-soft); margin: 4px 0; }

/* ---- 页面 ---- */
.page { padding: 32px 32px 64px; max-width: 1280px; margin: 0 auto; width: 100%; animation: fadeUp .35s ease; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
.page-head h2 { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
.page-head p { font-size: 13px; color: var(--text-2); margin-top: 4px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-sm); transition: box-shadow .25s ease, transform .25s ease, background .25s ease, border-color .25s ease;
}
.card.pad { padding: 24px; }
/* 金额数字等宽，避免跳动 */
.tnum, .stat-num, .total-row b, .appr-amount { font-variant-numeric: tabular-nums; }

/* ---- 工作台 ---- */
.greet { font-size: 24px; font-weight: 700; letter-spacing: .3px; }
.greet-sub { color: var(--text-2); font-size: 13.5px; margin-top: 6px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 24px 0; }
.stat-card { padding: 20px 22px; display: flex; align-items: center; gap: 16px; cursor: pointer; }
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.stat-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.stat-num { font-size: 26px; font-weight: 700; line-height: 1.2; }
.stat-label { font-size: 12.5px; color: var(--text-2); }
.dash-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
.dash-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.panel-head h3 { font-size: 15px; font-weight: 700; }
.panel-head .more { font-size: 12.5px; color: var(--accent); cursor: pointer; font-weight: 500; }
.panel-head .more:hover { text-decoration: underline; }
.todo-item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .15s; border-radius: 8px; }
.todo-item:last-child { border-bottom: none; }
.todo-item:hover { background: var(--hover-bg); }
.checkbox {
  width: 20px; height: 20px; border-radius: 7px; border: 1.5px solid var(--text-3);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; transition: all .2s; background: transparent;
}
.checkbox.done { background: var(--green); border-color: var(--green); }
.todo-text { flex: 1; font-size: 13.5px; min-width: 0; }
.todo-text.done { text-decoration: line-through; color: var(--text-3); }
.todo-due { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: var(--border); border-radius: 2px; }
.tl-item { position: relative; padding-bottom: 20px; }
.tl-item:last-child { padding-bottom: 2px; }
.tl-dot { position: absolute; left: -24px; top: 4px; width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--card); box-shadow: 0 0 0 2px var(--border); }
.tl-text { font-size: 13px; }
.tl-text b { font-weight: 600; }
.tl-time { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.chart-tip { pointer-events: none; }

/* ---- 标签 ---- */
.badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.badge.red, .badge.high { background: var(--red-soft); color: var(--red); }
.badge.orange, .badge.mid { background: var(--orange-soft); color: var(--orange); }
.badge.green, .badge.low, .badge.done { background: var(--green-soft); color: var(--green); }
.badge.blue { background: var(--blue-soft); color: var(--accent); }
.badge.purple { background: var(--purple-soft); color: var(--purple); }
.badge.gray { background: var(--input-bg); color: var(--text-2); }

/* ---- 筛选条 ---- */
.filter-bar { display: flex; align-items: center; gap: 8px; row-gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.seg { display: flex; background: var(--input-bg); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: none; background: transparent; padding: 7px 16px; border-radius: 9px; font-size: 13px; color: var(--text-2); font-weight: 500; transition: all .22s ease; }
.seg button:hover { color: var(--text); }
.seg button.active { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }

/* ---- 审批 ---- */
.approval-list { display: flex; flex-direction: column; gap: 12px; }
.approval-item {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 16px;
  padding: 18px 22px; cursor: pointer; align-items: center;
}
.approval-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.appr-title { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.appr-desc { font-size: 12.5px; color: var(--text-2); margin-top: 5px; }
.appr-side { text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.appr-time { font-size: 11.5px; color: var(--text-3); }

/* ---- 抽屉 ---- */
.drawer-mask { position: fixed; inset: 0; background: rgba(10,14,20,.42); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 90; }
.drawer-mask.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 92vw;
  background: var(--drawer-frost); z-index: 95;
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  transform: translateX(105%); transition: transform .3s cubic-bezier(.32,.72,.28,1);
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  border-left: 1px solid var(--border);
}
.drawer.show { transform: translateX(0); }
.drawer-head { padding: 24px 24px 16px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.drawer-head h3 { font-size: 17px; font-weight: 700; line-height: 1.5; }
.drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
.drawer-foot { padding: 16px 24px; border-top: 1px solid var(--border-soft); display: flex; gap: 12px; }
.info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; }
.info-row:last-child { border-bottom: none; }
.info-row .k { color: var(--text-2); }
.info-row .v { font-weight: 500; text-align: right; }
.desc-box { background: var(--card-2); border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 16px; font-size: 13px; color: var(--text-2); margin: 14px 0; line-height: 1.7; }
.step-timeline { position: relative; padding-left: 30px; margin: 6px 0 4px; }
.step-timeline::before { content: ""; position: absolute; left: 10px; top: 10px; bottom: 10px; width: 2px; background: var(--border); border-radius: 2px; }
.step { position: relative; padding-bottom: 22px; }
.step:last-child { padding-bottom: 0; }
.step-dot { position: absolute; left: -26px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 3px solid var(--text-3); }
.step.done .step-dot { border-color: var(--green); background: var(--green); }
.step.current .step-dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step.reject .step-dot { border-color: var(--red); background: var(--red); }
.step-title { font-size: 13.5px; font-weight: 600; }
.step-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }

/* ---- 按钮 ---- */
.btn {
  border: none; border-radius: 12px; padding: 10px 22px; font-size: 13.5px; font-weight: 600;
  transition: all .22s ease; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px -6px rgba(10,132,255,.5); }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-success { background: var(--green); color: #fff; box-shadow: 0 6px 16px -6px rgba(40,199,111,.5); }
.btn-success:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn-danger { background: var(--red); color: #fff; box-shadow: 0 6px 16px -6px rgba(255,90,95,.5); }
.btn-danger:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn-ghost { background: var(--input-bg); color: var(--text); }
.btn-ghost:hover { background: var(--hover-bg); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

/* ---- 通讯录 ---- */
.contact-layout { display: grid; grid-template-columns: 270px 1fr; gap: 18px; align-items: start; }
.tree { padding: 10px; }
.tree-node { user-select: none; }
.tree-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 13.5px; transition: background .15s; }
.tree-row:hover { background: var(--hover-bg); }
.tree-row.selected { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tree-caret { width: 18px; text-align: center; color: var(--text-3); font-size: 11px; transition: transform .2s; flex-shrink: 0; }
.tree-caret.open { transform: rotate(90deg); }
.tree-children { margin-left: 14px; border-left: 1px solid var(--border); padding-left: 8px; }
.tree-count { margin-left: auto; font-size: 11px; color: var(--text-3); background: var(--input-bg); border-radius: 10px; padding: 1px 8px; }
.member-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.member-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.member-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.member-info { flex: 1; min-width: 0; }
.member-name { font-size: 14px; font-weight: 600; }
.member-title { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.member-contact { font-size: 11.5px; color: var(--text-3); margin-top: 6px; line-height: 1.7; }
.avatar { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; flex-shrink: 0; }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.input {
  background: var(--input-bg); border: 1px solid transparent; border-radius: 12px;
  padding: 10px 16px; font-size: 13.5px; color: var(--text); outline: none; transition: all .2s; width: 280px;
}
.input:focus { background: var(--card); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---- 文档 ---- */
.doc-layout { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
.folder-list { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.folder-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; cursor: pointer; font-size: 13.5px; transition: all .15s; border: none; background: transparent; width: 100%; text-align: left; color: var(--text); }
.folder-item:hover { background: var(--hover-bg); }

  if (!HAS_THREE) return false;

    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    return !!gl;
  } catch (e) { return false; }
}
function isDark() { return document.documentElement.dataset.theme === "dark"; }

function avatarColor(name) {
  let h = 0;
  for (const ch of String(name)) h = ((h * 31) + ch.codePointAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function avatarHTML(name, size) {
  size = size || 38;
  const initial = String(name || "?").trim().charAt(0);
  return '<span class="avatar" style="width:' + size + 'px;height:' + size +
    'px;background:' + avatarColor(name) + ';font-size:' + Math.round(size * 0.42) +
    'px">' + esc(initial) + "</span>";

  return '<div class="empty">' + emptySVG() + '<div class="e-text">' + esc(text) + "</div></div>";

    '<button class="btn btn-ghost" onclick="closeModal()">取消</button>' +

  if (input) { input.focus(); input.onkeydown = e => { if (e.key === "Enter") $("#modalOk").click(); }; }

  $("#modalBox").classList.remove("wide");
}

/* 近7天报价金额（3D 柱状图与 SVG 折线图共用同一数据源） */
const TREND_DATA = [12.8, 45.6, 8.2, 28.6, 33.4, 15.2, 72.0];
const TREND_LABELS = ["10-15", "10-16", "10-17", "10-18", "10-19", "10-20", "10-21"];

function weeklyChartSVG() {
  const data = TREND_DATA;
  const labels = TREND_LABELS;
  const W = 620, H = 230, P = { l: 36, r: 14, t: 16, b: 30 };
  const max = 80;
  const x = i => P.l + (i * (W - P.l - P.r)) / (data.length - 1);
  const y = v => H - P.b - (v / max) * (H - P.t - P.b);
  let line = "", area = "";
  data.forEach((v, i) => {
    line += (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1) + " ";
  });
  area = line + "L" + x(data.length - 1).toFixed(1) + "," + (H - P.b) +
         " L" + x(0).toFixed(1) + "," + (H - P.b) + " Z";
  let dots = "", grids = "", xlabels = "";
  data.forEach((v, i) => {
    dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) +
      '" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2.5"><title>' +
      labels[i] + "：报价 " + v + " 万元</title></circle>" +
      '<text x="' + x(i).toFixed(1) + '" y="' + (y(v) - 12).toFixed(1) +
      '" text-anchor="middle" font-size="11" fill="var(--text-2)" font-weight="600">' + v + "</text>";
    xlabels += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 10) +
      '" text-anchor="middle" font-size="11" fill="var(--text-3)">' + labels[i] + "</text>";
  });
  [0, 20, 40, 60, 80].forEach(v => {
    grids += '<line x1="' + P.l + '" y1="' + y(v) + '" x2="' + (W - P.r) + '" y2="' + y(v) +
      '" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>' +
      '<text x="' + (P.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="var(--text-3)">' + v + "</text>";
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block">' +
    "<defs><linearGradient id=\"areaGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">" +
    '<stop offset="0" stop-color="#0a84ff" stop-opacity="0.28"/>' +
    '<stop offset="1" stop-color="#0a84ff" stop-opacity="0.02"/></linearGradient></defs>' +
    grids + '<path d="' + area + '" fill="url(#areaGrad)"/>' +
    '<path d="' + line + '" fill="none" stroke="#0a84ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + xlabels + "</svg>";
}

const QUOTE_STATUSES = ["全部", "草稿", "待审批", "已批准", "已驳回", "已转订单"];

const QUOTE_FIELDS = [
  { key: "customer",    label: "客户名称",   type: "text",   required: true,  placeholder: "如：XX小区物业" },
  { key: "project",     label: "项目名称",   type: "text",   required: true,  placeholder: "如：XX小区配电工程" },

/* 详情抽屉信息行配置 */
const QUOTE_INFO_ROWS = [
  { label: "客户联系人", value: q => esc(q.contact) + " · " + esc(q.phone) },
  { label: "业务员",     value: q => esc(q.salesperson) },

];

function fmtMoney(n) {
  n = Number(n) || 0;
  if (n >= 10000) return "¥" + (n / 10000).toFixed(2) + "万";
  return "¥" + n.toLocaleString("zh-CN");
}
function quoteAmount(q) {
  return (q.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
}
/* 小计（未税）、税额、价税合计 */
function quoteTaxRateNum(q) {
  return (parseFloat(String(q.taxRate || "13%").replace("%", "")) / 100) || 0;
}
function quoteTax(q) { return quoteAmount(q) * quoteTaxRateNum(q); }
function quoteGrandTotal(q) { return quoteAmount(q) + quoteTax(q); }
function lineAmount(it) { return (Number(it.qty) || 0) * (Number(it.price) || 0); }
function nowHM() {
  const d = new Date();
  return "10-21 " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
}

function quoteStepsHTML(q) {
  function step(cls, title, sub) {
    return '<div class="step ' + cls + '"><span class="step-dot"></span><div class="step-title">' + title +
      '</div><div class="step-sub">' + sub + "</div></div>";
  }
  let s1, s2, s3;
  if (q.status === "草稿") {
    s1 = step("current", "提交报价", "待提交 · 当前节点");
    s2 = step("", "技术审核", "等待提交");
    s3 = step("", "领导审批", "等待提交");
  } else if (q.status === "待审批") {
    s1 = step("done", "提交报价", esc(q.salesperson) + " · " + esc(q.created));
    s2 = step("current", "技术审核", "审核中 · 当前节点");
    s3 = step("", "领导审批", "等待技术审核");
  } else if (q.status === "已驳回") {
    s1 = step("done", "提交报价", esc(q.salesperson) + " · " + esc(q.created));
    s2 = step("reject", "技术审核", "已驳回，请修改后重新提交");
    s3 = step("", "领导审批", "—");
  } else {
    s1 = step("done", "提交报价", esc(q.salesperson) + " · " + esc(q.created));
    s2 = step("done", "技术审核", "已通过");
    s3 = step("done", "领导审批", q.status === "已转订单" ? "已批准 · 已转订单" : "已批准");
  }
  return '<div class="step-timeline">' + s1 + s2 + s3 + "</div>";
}

function decideQuote(id, action) {
  const q = DB.quotes.find(x => x.id === id);
  if (!q) return;
  const linkAppr = st => {
    const a = DB.approvals.find(x => x.quoteId === id && x.status === "待审批");
    if (a) a.status = st;
  };
  if (action === "del") {
    DB.quotes = DB.quotes.filter(x => x.id !== id);
    closeDrawer(); toast("草稿已删除", "🗑️"); render(); return;
  }
  if (action === "submit" || action === "resubmit") {
    q.status = "待审批";
    DB.approvals.unshift({
      id: "a" + Date.now(), applicant: q.salesperson, dept: "销售部", type: "报价审批",
      detail: q.project + " " + fmtMoney(quoteGrandTotal(q)), amount: fmtMoney(quoteGrandTotal(q)),
      submitted: nowHM(), status: "待审批", reason: q.remark || "报价审批申请", quoteId: q.id
    });
    toast("已提交审批", "📤");
  } else if (action === "approve") {
    q.status = "已批准"; linkAppr("已通过"); toast("报价单已批准", "✅");
  } else if (action === "reject") {
    q.status = "已驳回"; linkAppr("已驳回"); toast("报价单已驳回", "🚫");
  } else if (action === "reorder") {
    q.status = "已转订单"; toast("已转为订单（演示：ERP 订单登记）", "📦");
  }
  render();
  if ($("#drawer").classList.contains("show")) openQuoteDrawer(id);
}

/* 报价审批单 → 打开报价详情（与审批中心打通） */
function openApprOrQuote(id) {
  const a = DB.approvals.find(x => x.id === id);
  if (a && a.type === "报价审批" && a.quoteId) { openQuoteDrawer(a.quoteId); return; }
  openApprovalDrawer(id);
}

/* ---- 协同评论 ---- */
function postComment(qid) {
  const q = DB.quotes.find(x => x.id === qid);
  const input = $("#commentInput");
  if (!q || !input) return;
  const text = input.value.trim();
  if (!text) { toast("评论内容不能为空", "⚠️"); return; }
  q.comments = q.comments || [];
  q.comments.push({ user: CURRENT_USER, text: text, time: "刚刚" });
  openQuoteDrawer(qid);
  toast("评论已发布", "💬");
}

  }).join("") +
    '<td class="row-amt tnum" style="font-weight:600;white-space:nowrap">¥0</td>' +
    '<td><button class="icon-btn row-del" style="width:30px;height:30px;font-size:13px" title="删除行">✕</button></td>';
  tr.querySelector(".row-del").addEventListener("click", () => {
    if (tb.rows.length <= 1) { toast("至少保留一行明细", "⚠️"); return; }
    tr.remove(); recalcQuoteForm();
  });
  tb.appendChild(tr);
}

function recalcQuoteForm() {
  const tb = $("#qfItems");
  if (!tb) return;
  let subtotal = 0;
  Array.from(tb.rows).forEach(tr => {
    const qty = Number(tr.querySelector('[data-k="qty"]').value) || 0;
    const price = Number(tr.querySelector('[data-k="price"]').value) || 0;
    const amt = qty * price;
    tr.querySelector(".row-amt").textContent = fmtMoney(amt);
    subtotal += amt;
  });
  const rateSel = $("#qf_taxRate");
  const rate = rateSel ? (parseFloat(rateSel.value.replace("%", "")) / 100 || 0) : 0.13;
  const tax = subtotal * rate;
  const set = (id, txt) => { const el = $("#" + id); if (el) el.textContent = txt; };
  set("qfSubtotal", fmtMoney(subtotal));
  set("qfTaxLabel", rateSel ? rateSel.value : "13%");
  set("qfTax", fmtMoney(tax));
  set("qfTotal", fmtMoney(subtotal + tax));
}

function collectQuoteItems() {
  const items = [];
  Array.from($("#qfItems").rows).forEach(tr => {
    const g = k => tr.querySelector('[data-k="' + k + '"]').value.trim();
    const item = {};
    QUOTE_ITEM_COLUMNS.forEach(c => {
      item[c.key] = c.type === "number" ? (Number(g(c.key)) || 0) : g(c.key);
    });
    const reqCol = QUOTE_ITEM_COLUMNS.find(c => c.required);
    if (reqCol && !item[reqCol.key]) return;
    items.push(item);
  });
  return items;
}

function saveQuote(submit) {
  const data = {};
  QUOTE_FIELDS.forEach(f => {
    const el = $("#qf_" + f.key);
    data[f.key] = el ? el.value.trim() : (f.def || "");
  });
  for (const f of QUOTE_FIELDS) {
    if (f.required && !data[f.key]) { toast("请填写" + f.label, "⚠️"); return; }
  }
  const items = collectQuoteItems();
  if (!items.length) { toast("请至少填写一行报价明细", "⚠️"); return; }
  const q = {
    id: "Q2026" + (quoteSeq++),
    customer: data.customer, project: data.project,
    contact: data.contact || "—", phone: data.phone || "—",
    salesperson: data.salesperson,
    delivery: data.delivery, taxRate: data.taxRate || "13%",
    remark: (data.remark ? data.remark + "；" : "") + (data.delivery ? "交期要求：" + data.delivery : ""),
    status: submit ? "待审批" : "草稿",
    created: nowHM(),
    items: items, comments: []
  };
  DB.quotes.unshift(q);
  if (submit) {
    DB.approvals.unshift({
      id: "a" + Date.now(), applicant: q.salesperson, dept: "销售部", type: "报价审批",
      detail: q.project + " " + fmtMoney(quoteGrandTotal(q)), amount: fmtMoney(quoteGrandTotal(q)),
      submitted: nowHM(), status: "待审批", reason: q.remark || "报价审批申请", quoteId: q.id
    });
  }
  closeModal();
  toast(submit ? "报价单 " + q.id + " 已提交审批" : "草稿 " + q.id + " 已保存", submit ? "📤" : "💾");
  if (state.page !== "quotes") goPage("quotes"); else render();
}

function deptTreeHTML(nodes, depth) {
  depth = depth || 0;
  return nodes.map(d => {

    const open = state.collapsedDepts[d.id] !== false; // 默认展开
    const selected = state.contactDept === d.name;
    let html = '<div class="tree-node">' +
      '<div class="tree-row' + (selected ? " selected" : "") + '" data-dept="' + esc(d.name) + '">' +
      (hasKids
        ? '<span class="tree-caret' + (open ? " open" : "") + '" data-toggle="' + d.id + '">▶</span>'
        : '<span class="tree-caret"></span>') +
      '<span>🏢</span><span>' + esc(d.name) + "</span>" +
      '<span class="tree-count">' + memberCount(d.name) + "</span></div>";

function globalSearch(kw) {
  kw = kw.trim().toLowerCase();
  const box = $("#searchResults");
  if (!kw) { box.classList.remove("show"); box.innerHTML = ""; return; }
  const results = [];
  DB.quotes.forEach(q => { const s = q.id + " " + q.customer + " " + q.project; if (s.toLowerCase().indexOf(kw) >= 0) results.push({ tag: "报价", text: q.id + " · " + q.project, go: "quotes", open: "quote:" + q.id }); });
  DB.approvals.forEach(a => { const s = a.applicant + "的" + a.type + "申请"; if (s.toLowerCase().indexOf(kw) >= 0) results.push({ tag: "审批", text: s, go: "approvals", open: "appr:" + a.id }); });
  DB.members.forEach(m => { if ((m.name + m.title).toLowerCase().indexOf(kw) >= 0) results.push({ tag: "联系人", text: m.name + " · " + m.title, go: "contacts" }); });
  DB.files.forEach(f => { if (f.name.toLowerCase().indexOf(kw) >= 0) results.push({ tag: "文档", text: f.name, go: "docs" }); });
  if (!results.length) {
    box.innerHTML = '<div style="padding:8px 0">' + emptyHTML("没有找到相关结果") + "</div>";
  } else {
    box.innerHTML = results.slice(0, 8).map((r, i) =>
      '<div class="search-result-item" data-idx="' + i + '"><span class="tag">' + r.tag + "</span><span>" +
      esc(r.text) + "</span></div>"
    ).join("");
    box._results = results;
    $$(".search-result-item", box).forEach(el => {
      el.addEventListener("click", () => {
        const r = box._results[+el.dataset.idx];
        box.classList.remove("show");
        $("#globalSearch").value = "";
        goPage(r.go);
        setTimeout(() => {
          if (r.open && r.open.indexOf("quote:") === 0) openQuoteDrawer(r.open.slice(6));
          if (r.open && r.open.indexOf("appr:") === 0) openApprOrQuote(r.open.slice(5));
        }, 80);
      });
    });
  }
  box.classList.add("show");
}

function loadSidePrefs() {
  try {
    const w = parseInt(localStorage.getItem("collab-side-w") || "", 10);
    if (w >= 160 && w <= 300) document.documentElement.style.setProperty("--sidebar-w", w + "px");
    if (localStorage.getItem("collab-side-collapsed") === "1")
      document.body.classList.add("side-collapsed");
  } catch (e) {}
  $("#sideCollapse").textContent = document.body.classList.contains("side-collapsed") ? "›" : "‹";
}

function setSideCollapsed(collapsed) {
  document.body.classList.toggle("side-collapsed", collapsed);
  $("#sideCollapse").textContent = collapsed ? "›" : "‹";
  try { localStorage.setItem("collab-side-collapsed", collapsed ? "1" : "0"); } catch (e) {}
}

function bindSideResizer() {
  const bar = $("#sideResizer");
  if (!bar) return;
  bar.addEventListener("pointerdown", e => {
    if (document.body.classList.contains("side-collapsed")) return;
    e.preventDefault();
    const w0 = parseFloat(getComputedStyle($("#sidebar")).width);
    const x0 = e.clientX;
    document.body.classList.add("resizing");
    const onMove = ev => {
      const w = Math.max(160, Math.min(300, Math.round(w0 + ev.clientX - x0)));
      document.documentElement.style.setProperty("--sidebar-w", w + "px");
    };
    const onUp = () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.body.classList.remove("resizing");
      try {
        const w = Math.round(parseFloat(getComputedStyle($("#sidebar")).width));
        localStorage.setItem("collab-side-w", String(w));
      } catch (err) {}
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  });
}

/* ================================================================
   3D 模块：工作台趋势柱状图 / 应用卡片 3D 倾斜 / 3D 柜体展厅
   ================================================================ */

/* ---------- 1) 工作台：近7天报价金额 3D 柱状图 ---------- */
let trend3d = null;

function disposeTrend3D() {
  if (!trend3d) return;
  try {
    cancelAnimationFrame(trend3d.raf);
    trend3d.scene.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        var ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(function (m) { if (m.map) m.map.dispose(); m.dispose(); });
      }
    });
    trend3d.renderer.dispose();
    var cv = trend3d.renderer.domElement;
    if (cv.parentNode) cv.parentNode.removeChild(cv);
  } catch (e) {}
  trend3d = null;
}

function barGradientTexture() {
  var c = document.createElement("canvas");
  c.width = 16; c.height = 128;
  var g = c.getContext("2d");
  var gr = g.createLinearGradient(0, 0, 0, 128);
  gr.addColorStop(0.0, "#6ab8ff");
  gr.addColorStop(0.55, "#0a84ff");
  gr.addColorStop(1.0, "#005fc4");
  g.fillStyle = gr; g.fillRect(0, 0, 16, 128);
  return new THREE.CanvasTexture(c);
}

function textSprite(text, color, scale) {
  var c = document.createElement("canvas");
  c.width = 160; c.height = 80;
  var g = c.getContext("2d");
  g.font = "700 34px -apple-system, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = color;
  g.fillText(text, 80, 42);
  var tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(scale || 0.95, (scale || 0.95) / 2, 1);
  sp.userData.text = text;
  return sp;
}

function refreshSpriteColor(sp, color) {
  if (!sp) return;
  var nt = textSprite(sp.userData.text, color, sp.scale.x);
  sp.material.map.dispose();
  sp.material.map = nt.material.map;
  sp.material.needsUpdate = true;
  nt.material.dispose();
}

function initTrend3D() {
  var wrap = $("#trend3d");
  if (!wrap || !webglOK()) return;
  disposeTrend3D();
  var W = wrap.clientWidth || 640, H = 300;
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    wrap.innerHTML = weeklyChartSVG(); // 兜底：回退 SVG 折线图
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  wrap.insertBefore(renderer.domElement, wrap.firstChild);

  var pal = theme3D();
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(pal.bg);
  scene.fog = new THREE.Fog(pal.bg, 11, 19);

  var camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
  camera.position.set(0, 3.9, 7.6);
  camera.lookAt(0, 1.0, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, pal.ground, 0.8));
  var key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(4.5, 7, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -6; key.shadow.camera.right = 6;
  key.shadow.camera.top = 7; key.shadow.camera.bottom = -3;
  key.shadow.camera.far = 25;
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xcfe4ff, 0.28);
  fill.position.set(-5, 3, -4);
  scene.add(fill);

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(34, 34),
    new THREE.ShadowMaterial({ opacity: pal.shadow })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  var grid = new THREE.GridHelper(10, 10, pal.grid, pal.grid);
  grid.position.y = 0.012;
  grid.material.transparent = true;
  grid.material.opacity = 0.55;
  scene.add(grid);

  var group = new THREE.Group();
  scene.add(group);
  var barTex = barGradientTexture();
  var bars = [];
  var maxV = 80, maxH = 2.75;
  TREND_DATA.forEach(function (v, i) {
    var geo = new THREE.BoxGeometry(0.58, 1, 0.58);
    geo.translate(0, 0.5, 0);
    var mat = new THREE.MeshStandardMaterial({ map: barTex, roughness: 0.3, metalness: 0.15 });
    var bar = new THREE.Mesh(geo, mat);
    var targetH = Math.max(0.08, (v / maxV) * maxH);
    bar.scale.y = 0.001;
    bar.position.set((i - 3) * 1.04, 0, 0);
    bar.castShadow = true;
    bar.userData = { value: v, targetH: targetH, delay: i * 0.09 };
    group.add(bar);
    bars.push(bar);
    var vs = textSprite(String(v), pal.label, 0.85);
    vs.position.set(bar.position.x, 0.34, 0);
    vs.material.opacity = 0;
    group.add(vs);
    bar.userData.vsprite = vs;
    var ds = textSprite(TREND_LABELS[i], pal.label, 0.62);
    ds.position.set(bar.position.x, 0.2, 1.18);
    group.add(ds);
    bar.userData.dsprite = ds;
  });

  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();
  var tip = $("#trendTip");
  var hovered = null;
  var dragging = false, lastX = 0, lastY = 0, lastInteract = 0;

  function clearHover() {
    if (hovered) {
      hovered.material.emissive.setHex(0x000000);
      hovered.scale.x = hovered.scale.z = 1;
      hovered = null;
    }
    if (tip) tip.style.display = "none";
    renderer.domElement.style.cursor = "grab";
  }
  function castAt(cx, cy) {
    var r = renderer.domElement.getBoundingClientRect();
    pointer.x = ((cx - r.left) / r.width) * 2 - 1;
    pointer.y = -((cy - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObjects(bars);
    return hits.length ? hits[0].object : null;
  }

  var cv = renderer.domElement;
  cv.addEventListener("pointerdown", function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    lastInteract = performance.now();
    if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
    cv.style.cursor = "grabbing";
  });
  cv.addEventListener("pointermove", function (e) {
    var r = wrap.getBoundingClientRect();
    if (dragging) {
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      group.rotation.y += dx * 0.006;
      group.rotation.x = Math.max(-0.12, Math.min(0.4, group.rotation.x + dy * 0.003));
      lastInteract = performance.now();
      return;
    }
    var bar = castAt(e.clientX, e.clientY);
    if (bar !== hovered) {
      clearHover();
      if (bar) {
        hovered = bar;
        bar.material.emissive.setHex(0x0a58c4);
        bar.material.emissiveIntensity = 0.45;
        bar.scale.x = bar.scale.z = 1.14;
        var idx = bars.indexOf(bar);
        tip.innerHTML = TREND_LABELS[idx] + "<br><b>" + TREND_DATA[idx] + " 万元</b>";
        tip.style.display = "block";
        cv.style.cursor = "pointer";
      }
    }
    if (hovered) {
      tip.style.left = (e.clientX - r.left) + "px";
      tip.style.top = (e.clientY - r.top) + "px";
    }
  });
  function endDrag() {
    dragging = false;
    lastInteract = performance.now();
    cv.style.cursor = hovered ? "pointer" : "grab";
  }
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);
  cv.addEventListener("pointerleave", function () { dragging = false; clearHover(); });

  var clock = new THREE.Clock();
  var elapsed = 0;
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  trend3d = {
    renderer: renderer, scene: scene, camera: camera, wrap: wrap,
    group: group, grid: grid, ground: ground, bars: bars,
    paused: false, hidden: false, raf: 0
  };

  (function loop() {
    if (!trend3d) return;
    trend3d.raf = requestAnimationFrame(loop);
    if (trend3d.paused || trend3d.hidden || document.hidden) return;
    var dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    bars.forEach(function (bar) {
      var t = (elapsed - bar.userData.delay) / 0.75;
      var k = easeOutCubic(Math.max(0, Math.min(1, t)));
      bar.scale.y = Math.max(0.001, bar.userData.targetH * k);
      if (bar.userData.vsprite) {
        bar.userData.vsprite.material.opacity = k;
        bar.userData.vsprite.position.y = bar.scale.y + 0.34;
      }
    });
    if (!dragging && performance.now() - lastInteract > 2500) {
      group.rotation.y += dt * 0.22; // 缓慢自动旋转
    }
    renderer.render(scene, camera);
  })();
}

function sizeTrend3D() {
  if (!trend3d) return;
  var w = trend3d.wrap.clientWidth || 640, h = 300;
  trend3d.camera.aspect = w / h;
  trend3d.camera.updateProjectionMatrix();
  trend3d.renderer.setSize(w, h);
}

function applyTrend3DTheme() {
  if (!trend3d) return;
  var pal = theme3D();
  trend3d.scene.background.setHex(pal.bg);
  trend3d.scene.fog.color.setHex(pal.bg);
  trend3d.grid.material.color.setHex(pal.grid);
  trend3d.ground.material.opacity = pal.shadow;
  trend3d.bars.forEach(function (bar) {
    refreshSpriteColor(bar.userData.vsprite, pal.label);
    refreshSpriteColor(bar.userData.dsprite, pal.label);
  });
}

/* ---------- 2) 应用中心：卡片 3D 倾斜（纯 CSS/JS） ---------- */
function tiltMove(e) {
  var el = e.currentTarget;
  var r = el.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width - 0.5;
  var py = (e.clientY - r.top) / r.height - 0.5;
  el.style.transition = "transform .1s ease-out";
  el.style.transform = "perspective(950px) rotateX(" + (-py * 16).toFixed(2) +
    "deg) rotateY(" + (px * 16).toFixed(2) + "deg) translateY(-4px)";
  el.style.setProperty("--mx", ((px + 0.5) * 100).toFixed(1) + "%");
  el.style.setProperty("--my", ((py + 0.5) * 100).toFixed(1) + "%");
}
function tiltLeave(e) {
  var el = e.currentTarget;
  el.style.transition = "transform .6s cubic-bezier(.18,.9,.26,1.28)"; // 弹性回正
  el.style.transform = "";
}
function bindAppTilt() {
  $$(".app-card").forEach(function (card) {
    if (card._tiltBound) return;
    card._tiltBound = true;
    card.classList.add("tilt3d");
    card.addEventListener("pointermove", tiltMove);
    card.addEventListener("pointerleave", tiltLeave);
  });
}

    '<div class="sr-infobar">' +
    '<span><b>GCS 型</b> 低压抽出式开关柜</span><span class="dot-sep">·</span>' +
    '<span>宽 <b>1000</b> × 深 <b>800</b> × 高 <b>2200</b> mm</span><span class="dot-sep">·</span>' +
    '<span>防护等级 <b>IP4X</b></span><span class="dot-sep">·</span>' +
    '<span>额定电流 <b>4000A</b></span><span class="dot-sep">·</span>' +
    '<span style="color:var(--text-3)">演示数据</span></div>';
  document.body.appendChild(ov);

  $("#srClose").addEventListener("click", closeShowroom);
  $$("#showroom .sr-btn[data-view]").forEach(function (b) {
    b.addEventListener("click", function () { flyToView(b.dataset.view); });
  });
  $("#srDoor").addEventListener("click", toggleShowroomDoor);

  var stage = $("#srStage");
  var W = stage.clientWidth || 900, H = stage.clientHeight || 520;
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    ov.parentNode.removeChild(ov);
    if (trend3d) trend3d.paused = false;
    toast("当前环境不支持 3D", "🧊");
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);
  var loading = $("#srLoading");
  if (loading) loading.style.display = "none";

  var pal = theme3D();
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(pal.bg);
  scene.fog = new THREE.Fog(pal.bg, 12, 26);

  var camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
  var CAM_HOME = { pos: new THREE.Vector3(2.9, 2.1, 3.6), tgt: new THREE.Vector3(0, 1.02, 0) };
  camera.position.copy(CAM_HOME.pos);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(CAM_HOME.tgt);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 1.7;
  controls.maxDistance = 10;
  controls.maxPolarAngle = 1.53;
  controls.update();

  /* 灯光 */
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a93a5, 0.85));
  var key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(4, 6.5, 3.5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -3.5; key.shadow.camera.right = 3.5;
  key.shadow.camera.top = 4.5; key.shadow.camera.bottom = -1.5;
  key.shadow.camera.far = 20;
  key.shadow.bias = -0.0004;
  scene.add(key);
  var rim = new THREE.DirectionalLight(0x9fc4ff, 0.5);
  rim.position.set(-4, 3.5, -4);
  scene.add(rim);
  var innerLight = new THREE.PointLight(0xffd9a3, 0, 3.4, 1.6);
  innerLight.position.set(0, 1.45, 0.1);
  scene.add(innerLight);

  /* 展台圆盘 */
  var discMat = new THREE.MeshStandardMaterial({
    color: isDark() ? 0x1b2029 : 0xe9edf4, roughness: 0.9, metalness: 0.05
  });
  var disc = new THREE.Mesh(new THREE.CylinderGeometry(1.65, 1.75, 0.09, 56), discMat);
  disc.position.y = -0.045;
  disc.receiveShadow = true;
  scene.add(disc);
  var ring = new THREE.Mesh(
    new THREE.RingGeometry(1.5, 1.57, 64),
    new THREE.MeshBasicMaterial({ color: 0x0a84ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.003;
  scene.add(ring);

  /* ===== 柜体搭建（GCS：宽 1.0 × 深 0.8 × 高 2.2） ===== */
  var cab = new THREE.Group();
  scene.add(cab);
  var M = {
    steel:   new THREE.MeshStandardMaterial({ color: 0x49515c, metalness: 0.55, roughness: 0.42 }),
    steelIn: new THREE.MeshStandardMaterial({ color: 0x2c323b, metalness: 0.35, roughness: 0.62 }),
    door:    new THREE.MeshStandardMaterial({ color: 0x515963, metalness: 0.55, roughness: 0.36 }),
    dark:    new THREE.MeshStandardMaterial({ color: 0x22262d, metalness: 0.3,  roughness: 0.55 }),
    copper:  new THREE.MeshStandardMaterial({ color: 0xc47f3d, metalness: 0.95, roughness: 0.32 }),
    red:     new THREE.MeshStandardMaterial({ color: 0xd94045, metalness: 0.2,  roughness: 0.5 }),
    orange:  new THREE.MeshStandardMaterial({ color: 0xff9f0a, metalness: 0.3,  roughness: 0.45 }),
    cable:   new THREE.MeshStandardMaterial({ color: 0x39404b, metalness: 0.1,  roughness: 0.7 }),
    plate:   new THREE.MeshStandardMaterial({ color: 0xd7dce4, metalness: 0.6,  roughness: 0.35 })
  };
  function box(w, h, d, mat, x, y, z, parent) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    (parent || cab).add(m);
    return m;
  }
  var T = 0.025, Wd = 1.0, Dp = 0.8, Ht = 2.2, base = 0.1;
  box(1.06, base, 0.86, M.dark, 0, base / 2, 0);                                  // 底座
  box(T, Ht, Dp, M.steel, -Wd / 2 + T / 2, base + Ht / 2, 0);                     // 左侧板
  box(T, Ht, Dp, M.steel,  Wd / 2 - T / 2, base + Ht / 2, 0);                     // 右侧板
  box(Wd, Ht, T, M.steel, 0, base + Ht / 2, -Dp / 2 + T / 2);                    // 背板
  box(Wd + 0.04, 0.045, Dp + 0.04, M.steel, 0, base + Ht + 0.022, 0);             // 顶盖
  box(Wd - 0.06, Ht - 0.06, 0.012, M.steelIn, 0, base + Ht / 2, -Dp / 2 + 0.045); // 内衬背板
  box(Wd - 0.05, 0.02, Dp - 0.06, M.steelIn, 0, base + 1.68, 0);                  // 母线室隔板
  box(Wd - 0.05, 0.02, Dp - 0.06, M.steelIn, 0, base + 0.68, 0);                  // 电缆室隔板
  // 母线室：三根铜排 + 绝缘子
  [-0.2, 0, 0.2].forEach(function (z) {
    box(0.88, 0.035, 0.07, M.copper, 0, base + 1.95, z);
    box(0.05, 0.1, 0.05, M.dark, -0.3, base + 1.86, z);
    box(0.05, 0.1, 0.05, M.dark,  0.3, base + 1.86, z);
  });
  // 断路器模块 ×3（深色盒体 + 红色拨杆 + 绿色指示灯）
  [-0.31, 0, 0.31].forEach(function (x) {
    box(0.27, 0.52, 0.56, M.dark, x, base + 1.18, -0.06);
    box(0.27, 0.04, 0.56, M.steelIn, x, base + 1.46, -0.06);
    box(0.05, 0.13, 0.035, M.red, x, base + 1.18, 0.235);
    var led = box(0.025, 0.025, 0.012,
      new THREE.MeshStandardMaterial({ color: 0x30d158, emissive: 0x30d158, emissiveIntensity: 0.9 }),
      x + 0.08, base + 1.36, 0.228);
    led.castShadow = false;
  });
  // 电缆室：5 根垂直电缆
  [-0.32, -0.16, 0, 0.16, 0.32].forEach(function (x, i) {
    var cb = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.52, 14),
      i % 2 ? M.cable : M.dark);
    cb.position.set(x, base + 0.4, 0.12);
    cb.castShadow = true;
    cab.add(cb);
  });
  /* 双开门（铰链组，旋转开合） */
  var doorH = 2.12, doorW = 0.478, doorT = 0.032;
  var front = Dp / 2 + doorT / 2 + 0.004;
  function makeDoor(side) { // side: -1 左门 / +1 右门
    var hinge = new THREE.Group();
    hinge.position.set(side * Wd / 2, base + 0.04 + doorH / 2, front - doorT / 2);
    var panel = new THREE.Mesh(new THREE.BoxGeometry(doorW, doorH, doorT), M.door);
    panel.position.set(-side * doorW / 2, 0, 0);
    panel.castShadow = true; panel.receiveShadow = true;
    hinge.add(panel);
    var stripe = new THREE.Mesh(new THREE.BoxGeometry(0.022, 1.5, 0.006), M.orange);
    stripe.position.set(-side * (doorW - 0.09), 0.1, doorT / 2 + 0.004);
    hinge.add(stripe);
    var handle = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.52, 12), M.dark);
    handle.position.set(-side * 0.09, 0, doorT / 2 + 0.035);
    handle.castShadow = true;
    hinge.add(handle);
    var plate = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.07, 0.008), M.plate);
    plate.position.set(-side * doorW / 2, 0.72, doorT / 2 + 0.004);
    hinge.add(plate);
    cab.add(hinge);
    return hinge;
  }
  var doorL = makeDoor(-1), doorR = makeDoor(1);
  var OPEN_ANGLE = 1.92; // 约 110°

  showroom = {
    open: true, paused: false, hidden: false, raf: 0,
    renderer: renderer, scene: scene, camera: camera, controls: controls,
    stage: stage, discMat: discMat,
    doorL: doorL, doorR: doorR, doorOpen: false, doorCur: 0,
    innerLight: innerLight, camAnim: null, CAM_HOME: CAM_HOME
  };

  var clock = new THREE.Clock();
  function easeIO(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  (function loop() {
    if (!showroom) return;
    showroom.raf = requestAnimationFrame(loop);
    if (showroom.paused || showroom.hidden || document.hidden) return;
    var dt = Math.min(clock.getDelta(), 0.05);
    // 开门动画（插值）
    var target = showroom.doorOpen ? 1 : 0;
    showroom.doorCur += (target - showroom.doorCur) * Math.min(1, dt * 5.5);
    if (Math.abs(target - showroom.doorCur) < 0.002) showroom.doorCur = target;
    var a = showroom.doorCur * OPEN_ANGLE;
    showroom.doorL.rotation.y = -a;
    showroom.doorR.rotation.y = a;
    // 开门时内部照明灯渐亮
    var lt = showroom.doorOpen ? 1.35 : 0;
    showroom.innerLight.intensity += (lt - showroom.innerLight.intensity) * Math.min(1, dt * 5);
    // 视角飞行动画
    var ca = showroom.camAnim;
    if (ca) {
      ca.t += dt / 0.75;
      var k = easeIO(Math.min(1, ca.t));
      camera.position.lerpVectors(ca.fromP, ca.toP, k);
      controls.target.lerpVectors(ca.fromT, ca.toT, k);
      if (ca.t >= 1) { showroom.camAnim = null; controls.enabled = true; }
    }
    controls.update();
    renderer.render(scene, camera);
  })();
}

function flyToView(name) {
  if (!showroom || !showroom.open) return;
  var presets = {
    front: { p: [0, 1.3, 4.8],      t: [0, 1.05, 0] },
    side:  { p: [4.8, 1.3, 0],      t: [0, 1.05, 0] },
    top:   { p: [0.001, 5.6, 0.001], t: [0, 0.8, 0] }
  };
  var s = showroom;
  var pr = presets[name];
  var toP = pr ? new THREE.Vector3(pr.p[0], pr.p[1], pr.p[2]) : s.CAM_HOME.pos.clone();
  var toT = pr ? new THREE.Vector3(pr.t[0], pr.t[1], pr.t[2]) : s.CAM_HOME.tgt.clone();
  s.controls.enabled = false;
  s.camAnim = {
    t: 0,
    fromP: s.camera.position.clone(), toP: toP,
    fromT: s.controls.target.clone(), toT: toT
  };
  $$("#showroom .sr-btn[data-view]").forEach(function (b) {
    b.classList.toggle("active", b.dataset.view === name);
  });
}

function toggleShowroomDoor() {
  if (!showroom || !showroom.open) return;
  showroom.doorOpen = !showroom.doorOpen;
  $("#srDoor").innerHTML = showroom.doorOpen ? "🚪 关门" : "🚪 开门";
}

function sizeShowroom() {
  if (!showroom || !showroom.open) return;
  var w = showroom.stage.clientWidth || 900, h = showroom.stage.clientHeight || 520;
  showroom.camera.aspect = w / h;
  showroom.camera.updateProjectionMatrix();
  showroom.renderer.setSize(w, h);
}

function applyShowroomTheme() {
  if (!showroom || !showroom.open) return;
  var pal = theme3D();
  showroom.scene.background.setHex(pal.bg);
  showroom.scene.fog.color.setHex(pal.bg);
  showroom.discMat.color.setHex(isDark() ? 0x1b2029 : 0xe9edf4);
}

function closeShowroom() {
  if (!showroom || !showroom.open) return;
  try {
    cancelAnimationFrame(showroom.raf);
    showroom.controls.dispose();
    showroom.scene.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        var ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(function (m) { if (m.map) m.map.dispose(); m.dispose(); });
      }
    });
    showroom.renderer.dispose();
    var ov = document.getElementById("showroom");
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
  } catch (e) {}
  showroom = null;
  if (trend3d) trend3d.paused = false; // 恢复工作台 3D
}

/* ---------- 3D 全局：尺寸自适应 / 切页与 tab 隐藏时暂停 / 主题跟随 ---------- */
window.addEventListener("resize", function () {
  sizeTrend3D();
  sizeShowroom();
});
document.addEventListener("visibilitychange", function () {
  var h = document.hidden;
  if (trend3d) trend3d.hidden = h;
  if (showroom && showroom.open) showroom.hidden = h;
});
function refresh3DTheme() {
  applyTrend3DTheme();
  applyShowroomTheme();
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
